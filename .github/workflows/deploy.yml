name: Deploy PsySim to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_DEMO_MODE: "false"
          VITE_NEON_AUTH_URL: ${{ vars.PSYSIM_NEON_AUTH_URL }}
          VITE_GEMINI_PROXY_URL: ${{ vars.PSYSIM_GEMINI_PROXY_URL }}
          VITE_API_BASE_URL: ${{ vars.PSYSIM_API_BASE_URL }}
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      # Keep the existing live site until the account backend is configured.
      - uses: peaceiris/actions-gh-pages@v4
        if: ${{ vars.PSYSIM_NEON_AUTH_URL != '' && vars.PSYSIM_API_BASE_URL != '' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
